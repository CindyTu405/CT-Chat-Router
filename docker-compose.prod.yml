services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db
    restart: always
    environment:
      TZ: Asia/Taipei
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 不開 ports,只有 compose 內部網路能連
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build: ./backend
    container_name: chat_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --root-path /api --forwarded-allow-ips '*'
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?SESSION_SECRET_KEY is required}
      - SESSION_COOKIE_SECURE=true
      - FRONTEND_URL=https://fluentbranch.com
      - CORS_ORIGINS=https://fluentbranch.com
      - ALLOWED_MODELS=${ALLOWED_MODELS:-gemini*}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - DAILY_MESSAGE_LIMIT=${DAILY_MESSAGE_LIMIT:-10}
      - SITE_DAILY_MESSAGE_LIMIT=${SITE_DAILY_MESSAGE_LIMIT:-900}
      - GUEST_IP_DAILY_GUESTS=${GUEST_IP_DAILY_GUESTS:-10}
      - GUEST_IP_DAILY_MESSAGES=${GUEST_IP_DAILY_MESSAGES:-100}
      - GUEST_RETENTION_DAYS=${GUEST_RETENTION_DAYS:-7}
      - IP_HASH_SECRET=${IP_HASH_SECRET:-}
      # (G2-10) OpenRouter 金鑰加密用（Fernet）；不設預設值，只放在 VM 的 .env，絕不進版控
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    # 不開 ports,由 nginx 代理
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build: ./frontend
    container_name: chat_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/fluentbranch/tls:/etc/nginx/tls:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:

# (CI-3) 每次 push 與對 main 的 PR 自動跑後端 harness 與前端 build。
# 不使用任何 secret；harness 用假模型與假登入，不呼叫真的 Gemini / OpenRouter。
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # openrouter_connect_harness 只允許 g2_tmp；guest_harness 拒絕 chat_db
          POSTGRES_DB: g2_tmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d g2_tmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 這組帳密只存在這台臨時機器上，跑完即銷毀
      DATABASE_URL: postgresql://ci:ci@localhost:5432/g2_tmp
      SQL_ECHO: "false"
      # CI 沒有 .env：openrouter_llm.py 在 import 時建立 client，沒有金鑰會直接報錯。
      # 以下都是假值，harness 用假模型與假登入，不會連到真的服務。
      OPENROUTER_API_KEY: ci-dummy-not-a-real-key
      # quota_harness 第 11 案直接呼叫 gemini_chat_stream（SDK 已換成假的），沒有金鑰會在函式開頭報錯
      GOOGLE_API_KEY: ci-dummy-not-a-real-key
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      GITHUB_CLIENT_ID: ci-dummy-github-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-github-client-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run migrations from empty database
        run: uv run alembic upgrade head
      - name: Run harnesses
        run: ./dev/run_harnesses.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
